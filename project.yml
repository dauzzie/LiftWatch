name: LiftWatch
options:
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0

configs:
  Debug: debug
  Release: release

targets:
  LiftWatchIOS:
    type: application
    platform: iOS
    sources:
      - path: iOS
        excludes:
          - Info.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liftwatch.ios
        INFOPLIST_FILE: iOS/Info.plist
        TARGETED_DEVICE_FAMILY: 1
        PRODUCT_NAME: LiftWatch
        PRODUCT_MODULE_NAME: LiftWatchIOS
        DEFINES_MODULE: YES
        CODE_SIGN_ENTITLEMENTS: iOS/LiftWatchIOS.entitlements
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
    dependencies:
      - target: LiftWatchWatchApp
        embed: true

  LiftWatchWatchExtension:
    type: watchkit2-extension
    platform: watchOS
    sources:
      - path: Watch
        excludes:
          - "*-Info.plist"
          - Assets.xcassets
      - path: Shared
        excludes:
          - CloudSyncManager.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liftwatch.ios.watchkitapp.watchkitextension
        INFOPLIST_FILE: Watch/WatchExtension-Info.plist

  LiftWatchWatchApp:
    type: application.watchapp2
    platform: watchOS
    sources:
      - path: Watch/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liftwatch.ios.watchkitapp
        INFOPLIST_FILE: Watch/WatchApp-Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: LiftWatchWatchExtension

  LiftWatchTests:
    type: bundle.unit-test
    platform: iOS
    hostApplication: LiftWatchIOS
    sources:
      - path: Tests
    dependencies:
      - target: LiftWatchIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liftwatch.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_NAME: LiftWatchTests
        PRODUCT_MODULE_NAME: LiftWatchTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/LiftWatch.app/LiftWatch"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  LiftWatch:
    build:
      targets:
        LiftWatchIOS: all
        LiftWatchWatchApp: all
        LiftWatchWatchExtension: all
    test:
      config: Debug
      targets:
        - LiftWatchTests
    run:
      config: Debug
      executable: LiftWatchIOS

  LiftWatch-All:
    build:
      targets:
        LiftWatchIOS: all
        LiftWatchWatchApp: all
        LiftWatchWatchExtension: all
    test:
      config: Debug
      targets:
        - LiftWatchTests
    run:
      config: Debug
      executable: LiftWatchIOS

  LiftWatch-Watch:
    build:
      targets:
        LiftWatchWatchApp: all
        LiftWatchWatchExtension: all
    run:
      config: Debug
      executable: LiftWatchWatchApp

  LiftWatch-CI:
    build:
      targets:
        LiftWatchIOS: all
    test:
      config: Debug
      targets:
        - LiftWatchTests
    run:
      config: Debug
      executable: LiftWatchIOS
