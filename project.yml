name: LiftWatch
options:
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    PRODUCT_NAME: LiftWatch
    SWIFT_VERSION: "5.0"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0

configs:
  Debug: debug
  Release: release

targets:
  LiftWatchIOS:
    type: application
    platform: iOS
    sources:
      - path: iOS
        excludes:
          - Info.plist
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liftwatch.ios
        INFOPLIST_FILE: iOS/Info.plist
        TARGETED_DEVICE_FAMILY: 1
    dependencies:
      - target: LiftWatchWatchApp
        embed: true

  LiftWatchWatchExtension:
    type: watchkit2-extension
    platform: watchOS
    sources:
      - path: Watch
        excludes:
          - "*-Info.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liftwatch.ios.watchkitapp.watchkitextension
        INFOPLIST_FILE: Watch/WatchExtension-Info.plist

  LiftWatchWatchApp:
    type: application.watchapp2
    platform: watchOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liftwatch.ios.watchkitapp
        INFOPLIST_FILE: Watch/WatchApp-Info.plist
    dependencies:
      - target: LiftWatchWatchExtension

schemes:
  LiftWatch:
    build:
      targets:
        LiftWatchIOS: all
        LiftWatchWatchApp: all
        LiftWatchWatchExtension: all
    run:
      config: Debug
      executable: LiftWatchIOS

  LiftWatch-All:
    build:
      targets:
        LiftWatchIOS: all
        LiftWatchWatchApp: all
        LiftWatchWatchExtension: all
    run:
      config: Debug
      executable: LiftWatchIOS

  LiftWatch-Watch:
    build:
      targets:
        LiftWatchWatchApp: all
        LiftWatchWatchExtension: all
    run:
      config: Debug
      executable: LiftWatchWatchApp
